name: Update Developer Universe

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developer-universe
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'rishit1769/Rishit1769'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.UNIVERSE_TOKEN || github.token }}
        run: python -m scripts.main
      - name: Validate SVG and README
        run: python -m unittest discover -s tests -v
      - name: Commit changed assets
        run: |
          git add README.md assets/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update developer universe [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
